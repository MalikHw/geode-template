name: Initialize Project

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  init:
    runs-on: ubuntu-latest
    if: github.run_number == 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace GEODE-PROJECT-NAME with repo name
        run: |
          find . \
            -not -path './.git/*' \
            -not -path './.github/workflows/init-project.yml' \
            -type f \
            -exec grep -lI 'GEODE-PROJECT-NAME' {} \; \
            | xargs -r sed -i "s/GEODE-PROJECT-NAME/${{ github.event.repository.name }}/g"

      - name: Remove this workflow file
        run: rm .github/workflows/init-project.yml

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: initialize project as ${{ github.event.repository.name }}"
          git push
